<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ms.Cookiza · Spin &amp; Win</title>
  <meta name="description" content="Spin the Ms.Cookiza wheel and win a discount or a free cookie treat.">
  <meta name="theme-color" content="#DB161B">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <main class="page">
    <header class="brand">
      <img class="brand__logo" src="img/logo.png" alt="Ms.Cookiza logo" width="140" height="140">
      <h1 class="brand__name">Ms.Cookiza</h1>
      <p class="brand__tag">Spin the wheel. Win something sweet.</p>
    </header>

    <section class="stage" aria-label="Spin to win">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Prize wheel"></canvas>
        <button id="spinBtn" class="hub" type="button">SPIN</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">Tap SPIN to try your luck!</p>
      <a id="claimLink" class="btn btn--primary" href="congrats.html" hidden>View my prize</a>
    </section>

    <section class="prizes" aria-labelledby="prizesTitle">
      <h2 id="prizesTitle">Prizes on the wheel</h2>
      <ul id="prizeList" class="prizes__list"></ul>
    </section>
  </main>
<div id="contactModal" class="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
    <p class="modal__eyebrow">Nice spin! 🎉</p>
    <h2 id="contactTitle" class="modal__title">Your prize is ready</h2>
    <p class="modal__text">Want to leave your name and phone number? It's optional — you can skip straight to your prize.</p>
    <form id="contactForm" novalidate>
      <label class="field">Name
        <input id="contactName" type="text" autocomplete="name" maxlength="60" placeholder="Your name">
      </label>
      <label class="field">Phone number
        <input id="contactPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="e.g. +971 10 000 0000">
      </label>
      <p id="contactError" class="modal__error" role="alert" hidden></p>
      <div class="modal__actions">
        <button class="btn btn--primary" type="submit">Save &amp; see my prize</button>
        <button class="btn btn--ghost" type="button" id="contactSkip">Skip</button>
      </div>
    </form>
  </div>
</div>
  <footer class="footer">© <span id="year"></span> Ms.Cookiza</footer>

  <script src="js/config.js"></script>
  <script src="js/wheel.js"></script>
</body>
</html>
